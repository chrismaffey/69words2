services:
  web:
    image: busybox:1.37
    user: "65534:65534"
    command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./public_html:/www:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
